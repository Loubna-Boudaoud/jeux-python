name: CI

on: push

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: avant checkout
        run: ls -la

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Après checkout
        run: ls -la
      - name: Compter les fichiers Python
        run: find . -type f -name "*.py" -not -path "./.git/*" | wc -l

      - name: Dire bonjour
        run: echo "Bonjour GitHub !"

      - name: Version Ubuntu
        run: lsb_release -a

      - name: Version Python
        run: python3 --version

      - name: Nombre de processeurs
        run: nproc

      - name: Mémoire et disque
        run: |
          free -h
          df -h /