name: CI

on: push

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Bonjour GitHub !"

      - name: Version Ubuntu
        run: lsb_release -a

      - name: Version Python
        run: python3 --version

      - name: Nombre de processeurs
        run: nproc

      - name: Mémoire et disque
        run: |
          free -h
          df -h /